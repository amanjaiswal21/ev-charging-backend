spring.application.name=ev-charging-backend
server.port=8080

charging.tariffs.ac.minimum-charge=50
charging.tariffs.ac.slabs[0].up-to-kwh=20
charging.tariffs.ac.slabs[0].rate-per-kwh=10
# Omit up-to-kwh on the final slab to charge all remaining energy.
charging.tariffs.ac.slabs[1].rate-per-kwh=8

charging.tariffs.dc.minimum-charge=150
charging.tariffs.dc.slabs[0].up-to-kwh=10
charging.tariffs.dc.slabs[0].rate-per-kwh=20
charging.tariffs.dc.slabs[1].up-to-kwh=25
charging.tariffs.dc.slabs[1].rate-per-kwh=14
charging.tariffs.dc.slabs[2].rate-per-kwh=9
